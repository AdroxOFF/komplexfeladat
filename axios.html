<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Axios CRUD - Szerelők</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Vízvezeték-szerelők és Karbantartók Hálózata</h1>
    </header>
    
    <nav>
        <ul>
            <li><a href="index.html">Főoldal</a></li>
            <li><a href="javascript.html">JS CRUD</a></li>
            <li><a href="react.html">React CRUD</a></li>
            <li><a href="spa/index.html">SPA (Játékok)</a></li>
            <li><a href="fetchapi.html">Fetch API</a></li>
            <li><a href="axios.html" class="active-nav">Axios</a></li>
            <li><a href="oojs.html">OOJS</a></li>
        </ul>
    </nav>

    <main>
        <h2>React + Axios CRUD Alkalmazás</h2>
        <hr>
        
        <div id="root"></div>

        <script type="text/babel">
            function App() {
                const [szerelok, setSzerelok] = React.useState([]);
                const [nev, setNev] = React.useState('');
                const [kezdev, setKezdev] = React.useState('');
                const [status, setStatus] = React.useState('Adatok betöltése...');

                const API_URL = 'api.php';

                const listaz = () => {
                    setStatus('Betöltés folyamatban...');
                    axios.get(API_URL)
                        .then(response => {
                            setSzerelok(response.data);
                            setStatus('');
                        })
                        .catch(error => {
                            console.error(error);
                            setStatus('Hiba a szerverhez való kapcsolódáskor!');
                        });
                };

                React.useEffect(() => {
                    listaz();
                }, []);

                const hozzaad = () => {
                    if (!nev || !kezdev) {
                        alert("Kérlek töltsd ki mindkét mezőt!");
                        return;
                    }
                    
                    axios.post(API_URL, {
                        nev: nev,
                        kezdev: parseInt(kezdev)
                    })
                    .then(response => {
                        setNev('');
                        setKezdev('');
                        listaz();
                    })
                    .catch(error => console.error(error));
                };

                const torol = (id) => {
                    if(window.confirm('Biztosan törlöd ezt a szerelőt az adatbázisból?')) {
                        axios.delete(`${API_URL}?id=${id}`)
                            .then(response => {
                                listaz();
                            })
                            .catch(error => console.error(error));
                    }
                };

                return (
                    <div>
                        <h3>Új szerelő rögzítése</h3>
                        <input type="text" placeholder="Szerelő neve" value={nev} onChange={(e) => setNev(e.target.value)} />
                        <input type="number" placeholder="Kezdés éve" value={kezdev} onChange={(e) => setKezdev(e.target.value)} />
                        <button onClick={hozzaad}>Mentés Axios-szal</button>

                        <div style={{color: 'var(--primary-blue)', fontWeight: 'bold', margin: '15px 0'}}>
                            {status}
                        </div>

                        <h3>Adatbázis tartalma</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Név</th>
                                    <th>Kezdés éve</th>
                                    <th>Művelet</th>
                                </tr>
                            </thead>
                            <tbody>
                                {szerelok.map(sz => (
                                    <tr key={sz.az}>
                                        <td>{sz.az}</td>
                                        <td><strong>{sz.nev}</strong></td>
                                        <td>{sz.kezdev}</td>
                                        <td>
                                            <button className="delete-btn" onClick={() => torol(sz.az)}>
                                                Törlés
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        </script>
        
        <img src="https://images.unsplash.com/photo-1505798577917-a65157d3320a?auto=format&fit=crop&w=800&q=80" 
         alt="Tiszta víz" 
         style="width: 100%; max-width: 600px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: 30px auto; display: block;">
    </main>

    <footer>
        <p>Készítette: Urosev Martin -------- A0B0ZZ</p>
    </footer>
</body>
</html>
